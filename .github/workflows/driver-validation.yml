name: Rust driver validation

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  WINTAP_WDK_VERSION: 10.0.28000.2526
  BUILD_CONFIGURATION: Release

jobs:
  repository-validation:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Validate Rust-only repository artifacts
        shell: pwsh
        run: .\tests\validate-spec-artifacts.ps1
      - name: Validate PowerShell syntax
        shell: pwsh
        run: |
          Get-ChildItem .\scripts,.\tests -Filter *.ps1 -File | ForEach-Object {
            $tokens = $null
            $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile(
              $_.FullName, [ref]$tokens, [ref]$errors) | Out-Null
            if ($errors.Count -ne 0) {
              $errors | Format-List | Out-String | Write-Error
              exit 1
            }
          }

  cargo-build:
    name: NuGet-only Cargo build
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Build Rust workspace from an empty package cache
        shell: pwsh
        run: |
          Remove-Item .\out\packages -Recurse -Force -ErrorAction SilentlyContinue
          Remove-Item Env:WDKContentRoot -ErrorAction SilentlyContinue
          cargo build

  package:
    name: Package Rust driver ${{ matrix.architecture }}
    runs-on: windows-2022
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        architecture: [x64, ARM64]
    steps:
      - uses: actions/checkout@v4
      - name: Install cargo-wdk
        shell: pwsh
        run: |
          rustup target add aarch64-pc-windows-msvc
          cargo install --locked cargo-wdk --version 0.1.1
      - name: Configure CMake
        shell: pwsh
        run: |
          cmake -S . -B ".\out\cmake\${{ matrix.architecture }}" `
            -G "Visual Studio 17 2022" `
            -A "${{ matrix.architecture }}" `
            -DWINTAP_CONFIGURATION="${{ env.BUILD_CONFIGURATION }}" `
            -DWINTAP_WDK_VERSION="${{ env.WINTAP_WDK_VERSION }}"
      - name: Build and package Rust driver
        shell: pwsh
        run: |
          cmake --build ".\out\cmake\${{ matrix.architecture }}" `
            --config "${{ env.BUILD_CONFIGURATION }}" `
            --target wintap_package `
            --parallel 2
      - name: Validate package
        shell: pwsh
        run: |
          .\tests\validate-package.ps1 `
            -Architecture "${{ matrix.architecture }}" `
            -Configuration "${{ env.BUILD_CONFIGURATION }}" `
            -PackageDirectory ".\out\cmake\${{ matrix.architecture }}\package\${{ matrix.architecture }}\${{ env.BUILD_CONFIGURATION }}"
      - uses: actions/upload-artifact@v4
        with:
          name: WinTapRust-${{ matrix.architecture }}
          path: out/cmake/${{ matrix.architecture }}/package/${{ matrix.architecture }}/${{ env.BUILD_CONFIGURATION }}/

  single-adapter-integration:
    name: Existing ICMP TAP integration
    needs: package
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: WinTapRust-x64
          path: .\artifacts\WinTapRust-x64
      - name: Run existing ICMP TAP harness
        shell: pwsh
        run: |
          .\tests\run-wintap-harness.ps1 -Integration `
            -InstallDriver `
            -RequireTestSigning `
            -PackageDirectory .\artifacts\WinTapRust-x64 `
            -DiagnosticsPath .\artifacts\wintap-harness
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: WinTapHarnessDiagnostics
          path: artifacts/wintap-harness/
          if-no-files-found: warn

  dual-adapter-integration:
    name: Routed dual-adapter integration
    needs: package
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: WinTapRust-x64
          path: .\artifacts\WinTapRust-x64
      - name: Restore pinned WDK DevCon
        id: devcon
        shell: pwsh
        run: |
          .\scripts\restore-dependencies.ps1 `
            -Architecture x64 `
            -Version "${{ env.WINTAP_WDK_VERSION }}" `
            -OutputDirectory .\out\packages
          $matches = @(
            Get-ChildItem .\out\packages -Recurse -Filter devcon.exe -File |
              Where-Object { $_.Directory.Name -eq "x64" }
          )
          if ($matches.Count -ne 1) {
            throw "Expected exactly one x64 devcon.exe in the restored WDK package; found $($matches.Count)."
          }
          "path=$($matches[0].FullName)" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
      - name: Run routed dual-adapter relay harness
        shell: pwsh
        run: |
          .\tests\run-wintap-dual-adapter-harness.ps1 `
            -PackageDirectory .\artifacts\WinTapRust-x64 `
            -Architecture x64 `
            -WdkVersion "${{ env.WINTAP_WDK_VERSION }}" `
            -DevConPath "${{ steps.devcon.outputs.path }}" `
            -DiagnosticsPath .\artifacts\wintap-dual-adapter-harness
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: WinTapDualAdapterDiagnostics
          path: artifacts/wintap-dual-adapter-harness/
          if-no-files-found: warn
